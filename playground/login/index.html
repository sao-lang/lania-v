<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lania-v · 登录</title>
    <style>
      :root {
        --bg0: #05070f;
        --bg1: #0b1020;
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.62);
        --sans:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: var(--sans);
        color: var(--text);
        background:
          radial-gradient(
            1200px 720px at 12% -12%,
            rgba(139, 92, 246, 0.28),
            transparent 58%
          ),
          radial-gradient(
            900px 640px at 104% 16%,
            rgba(56, 189, 248, 0.2),
            transparent 56%
          ),
          radial-gradient(
            900px 640px at 46% 112%,
            rgba(16, 185, 129, 0.14),
            transparent 58%
          ),
          linear-gradient(180deg, var(--bg0), var(--bg1));
        background-attachment: fixed;
      }

      #app {
        min-height: 100%;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .app-footnote {
        margin: 22px 0 0;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
      }

      .app-footnote code {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
